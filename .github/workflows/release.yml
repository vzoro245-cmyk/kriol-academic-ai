name: Build e Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Restaurar dependências do Flutter
        run: flutter pub get

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Criar key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release-key.jks" >> android/key.properties

      - name: Build APK release
        run: flutter build apk --release

      - name: Extrair nome da versão da tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "Kriol Academic AI ${{ steps.get_version.outputs.VERSION }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js para atualizar Firestore
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar firebase-admin
        run: npm install firebase-admin

      - name: Atualizar Firestore com a nova versao
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VERSION_TAG: ${{ steps.get_version.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          node -e "
          const admin = require('firebase-admin');
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          admin.initializeApp({ credential: admin.credential.cert(serviceAccount) });
          const db = admin.firestore();

          const versionTag = process.env.VERSION_TAG;
          const version = versionTag.replace(/^v/, '');
          const updateUrl = \`https://github.com/\${process.env.REPO}/releases/download/\${versionTag}/app-release.apk\`;

          db.collection('settings').doc('android_update').update({
            latestVersion: version,
            minimumVersion: version,
            updateUrl: updateUrl
          }).then(() => {
            console.log('Firestore atualizado com sucesso: ' + version);
            process.exit(0);
          }).catch((err) => {
            console.error('Erro ao atualizar Firestore:', err);
            process.exit(1);
          });
          "
